<div class="container mt-4">
    <div class="d-flex justify-content-between mb-3">
        <h3>Listado de Países</h3>
        <button class="btn btn-primary" (click)="nuevopais()">Agregar País</button>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Nombre del País</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            @for (pais of listadoPaises; track pais.id; let i = $index) {
                <tr>
                    <td>{{ i + 1 }}</td>
                    <td>{{ pais.nombre }}</td> <td>
                        <button class="btn btn-warning btn-sm me-2">Editar</button>
                        <button class="btn btn-danger btn-sm">Eliminar</button>
                    </td>
                </tr>
            } @empty {
                <tr>
                    <td colspan="3" class="text-center">No hay países registrados.</td>
                </tr>
            }
        </tbody>
    </table>
</div>
